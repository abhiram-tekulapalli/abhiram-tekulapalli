name: Update contribution animation

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-animation
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: abhiram-tekulapalli
          outputs: |
            dist/github-snake.svg?palette=github&color_snake=%2358d6e8
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2358d6e8

      - name: Publish generated images
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
