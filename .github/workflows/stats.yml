name: Refresh profile statistics

on:
  push:
    branches:
      - master
    paths:
      - README.md
      - .github/workflows/stats.yml
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Generate profile statistics card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=abhiram-tekulapalli&show_icons=true&hide_border=true&title_color=58D6E8&icon_color=58D6E8&text_color=8B949E&bg_color=0D1117
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=abhiram-tekulapalli&layout=compact&langs_count=5&hide_border=true&title_color=58D6E8&text_color=8B949E&bg_color=0D1117
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: refresh profile statistics" || exit 0
          git push
